name: macOS package

on:
  pull_request:
    paths: &mac_paths
      - .github/workflows/macos-package.yml
      - 'app/**'
      - 'input/**'
      - 'platforms/index.js'
      - 'platforms/desktop/macos/**'
      - 'native/macos-mouse.c'
      - scripts/build-mac.js
      - scripts/verify-macos-pkg.sh
      - build/icon-source.png
      - client.html
      - server.js
      - package.json
      - package-lock.json
  push:
    branches: [dev, main]
    paths: *mac_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:mac -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer payload and universal binaries
        run: bash scripts/verify-macos-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-pkg-review
          path: dist/*.pkg
          if-no-files-found: error
