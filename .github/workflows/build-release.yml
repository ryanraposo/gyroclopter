name: build-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    outputs:
      artifact_url: ${{ steps.upload-win.outputs.artifactci-run-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build:icons
      - run: npm run build:win -- --publish=never
      - name: Smoke-test the .exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath "dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found in dist/"; exit 1 }
          Write-Host "Smoke test: $($exe.Name) exists"
      - id: upload-win
        uses: mmkal/artifact.ci/upload@main
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          artifactci-visibility: public

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload-linux.outputs.artifactci-run-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build:icons
      - run: npm run build:linux -- --publish=never
      - name: Smoke-test the .deb
        run: |
          set -e
          DEB=$(ls dist/*.deb | head -1)
          dpkg-deb -I "$DEB"
          echo "Smoke test passed: $(basename $DEB) is valid"
      - id: upload-linux
        uses: mmkal/artifact.ci/upload@main
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error
          artifactci-visibility: public
      - name: Package ChromeOS test kit
        run: |
          mkdir -p dist/chromeos-kit
          cp -R chromeos/extension dist/chromeos-kit/extension
          cp chromeos/README-FIRST.txt dist/chromeos-kit/
          cp CHROMEOS.md dist/chromeos-kit/
          cd dist/chromeos-kit
          zip -r ../gyroclopter-chromeos-test-kit.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: chromeos-test-kit
          path: dist/gyroclopter-chromeos-test-kit.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: test
    runs-on: macos-15
    outputs:
      artifact_url: ${{ steps.upload-mac.outputs.artifactci-run-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build:mac -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test native helper and packages
        run: |
          set -e
          file build/macos/gyroclopter-mouse | grep -q 'universal binary'
          build/macos/gyroclopter-mouse --self-test | grep -q SELF_TEST_OK
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          HELPER=$(find dist -path '*/Gyroclopter.app/Contents/Resources/native/gyroclopter-mouse' -print -quit)
          test -n "$HELPER"
          test -x "$HELPER"
          "$HELPER" --self-test | grep -q SELF_TEST_OK
      - id: upload-mac
        uses: mmkal/artifact.ci/upload@main
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          artifactci-visibility: public

  release:
      needs: [build-windows, build-linux, build-macos]
      runs-on: ubuntu-latest
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" $PREV_TAG..HEAD > /tmp/release_notes.md
            echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/release_notes.md >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_NOTES=Initial release" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.zip
            CHANGELOG.md
