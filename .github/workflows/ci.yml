name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build:icons
      - run: npm run web:build
      - run: npm run web:verify
      - name: Validate ChromeOS extension and packaging
        run: |
          node --check chromeos/extension/service-worker.js
          node --check chromeos/extension/setup.js
          node -e "JSON.parse(require('fs').readFileSync('chromeos/extension/manifest.json', 'utf8')); const p=require('./package.json'); if(!p.name || !p.version || !p.main || !p.build.files.includes('input/**/*')) throw new Error('Invalid package metadata or missing input backends')"
