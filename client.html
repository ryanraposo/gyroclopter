<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><title>Gyroclopter Remote</title>
<style>
:root{--cream:#fff8ed;--orange:#ff8a08;--red:#ef2d20;--blue:#1260db;--green:#16b942;--ink:#24140c;--line:#54270e;--muted:#806b59}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{height:100dvh;overflow:hidden;background:#eadcc8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100%;max-width:540px;margin:auto;display:flex;flex-direction:column;overflow:hidden;padding:calc(12px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 30%,#fffdf8,var(--cream) 65%,#f3dfc6);position:relative}
.app:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--green) 0 18%,var(--blue) 18% 38%,var(--red) 38% 60%,#ffc928 60% 78%,var(--green) 78%)}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:52px;height:52px;flex:0 0 52px;display:grid;place-items:center}
.logo .mascot{width:100%;height:100%;display:block;overflow:visible}
.wordmark{font-weight:1000;font-size:clamp(18px,5vw,24px);line-height:.95;letter-spacing:.08em}
.wordmark span{display:block}
.status{display:flex;align-items:center;gap:6px;font-size:8px;font-weight:900;letter-spacing:.08em;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#e89a20;box-shadow:0 0 0 3px #e89a2024}
.settings{display:grid;gap:7px;z-index:1}
.setting{padding:8px 11px 7px;border:1.5px solid var(--line);border-radius:13px;background:linear-gradient(110deg,#fffdf7,#f6ead8);box-shadow:0 2px 0 #dfc7a7}
.row{display:flex;justify-content:space-between;align-items:center}
label{font-size:9px;font-weight:900;letter-spacing:.13em}.value{font-size:10px;color:#bd4e09;font-variant-numeric:tabular-nums}
input[type=range]{appearance:none;width:100%;height:15px;margin:3px 0 0;background:transparent;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--orange) 0 50%,#dec9ad 50%);border-radius:4px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;margin-top:-6px;border-radius:50%;background:var(--orange);border:2px solid #fff3d3;box-shadow:0 0 0 3px #e9892730}
.playfield{flex:1;min-height:80px;position:relative;touch-action:none}
.key{position:absolute;width:70%;height:41%;min-height:112px;display:grid;place-items:center;border:3px solid var(--line);color:var(--ink);background:linear-gradient(145deg,#ffc64a 0%,#ff9418 48%,#f36e08 100%);box-shadow:0 8px 0 #aa4607,0 14px 24px #54270e35,inset 0 3px #fff4cb,inset 0 -4px #cf5208;overflow:hidden;touch-action:none}
.key:before{content:"";position:absolute;inset:5px 9px auto;height:28%;border-radius:50%;background:linear-gradient(#fff8db8c,transparent)}
.key span{z-index:1;font-size:clamp(78px,25vw,118px);line-height:1;font-weight:900;color:#32190d;text-shadow:0 2px #ffe2a0}
#right-click{right:-1%;top:3%;transform:rotate(-5deg);border-radius:46% 35% 42% 32%/40% 40% 48% 45%}
#left-click{left:-1%;bottom:3%;transform:rotate(5deg);border-radius:35% 46% 32% 42%/42% 47% 38% 50%}
#right-click:active,#right-click.pressed{transform:rotate(-5deg) scale(.97);filter:brightness(1.06)}
#left-click:active,#left-click.pressed{transform:rotate(5deg) scale(.97);filter:brightness(1.06)}
.connect{z-index:1;flex:0 0 50px;border:2px solid var(--line);border-radius:14px;background:linear-gradient(100deg,#ffd84b,#ff9e18 58%,#f27b0b);box-shadow:0 4px 0 #ae4d08,inset 0 2px #fff5c8;color:var(--ink);font-size:10px;font-weight:950;letter-spacing:.16em;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.connect .dot{background:var(--green);box-shadow:0 0 0 3px #16b94224}
.guard{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding-top:3px;color:#705b47;font-size:7px;font-weight:900;letter-spacing:.1em}
.guard button{border:1px solid #9d8263;border-radius:99px;background:#fff9ee;padding:3px 6px;color:#705b47;font-size:7px;font-weight:900;letter-spacing:.05em}
.guard button[aria-pressed=true]{background:#ffdf92;border-color:#8c4b12;color:#40200b}
#modal{position:fixed;inset:0;z-index:10;background:#fff8ed;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center}
#modal h2{font-size:22px;margin-bottom:12px}#modal p{color:var(--muted);line-height:1.5;margin-bottom:24px}
.primary{border:2px solid var(--line);border-radius:999px;background:linear-gradient(#ffc64a,#ff8507);color:var(--ink);padding:15px 25px;font-weight:950;letter-spacing:.08em}
.hidden{display:none!important}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-height:700px){header{padding:2px 0 7px}.logo,.logo img{width:42px;height:42px}.logo{flex-basis:42px}.settings{gap:4px}.setting{padding:5px 9px 4px}.playfield{min-height:65px}.key{min-height:90px}.connect{flex-basis:42px;height:42px}.guard{padding-top:5px}}
</style></head><body>
<main class="app">
<header><div class="brand"><div class="logo"><svg class="mascot" viewBox="0 0 64 64" role="img" aria-label="Gyroclopter mascot" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="body" x2=".15" y2="1"><stop stop-color="#ffb326"/><stop offset="1" stop-color="#f47708"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe75a"/><stop offset="1" stop-color="#ff9f00"/></linearGradient></defs>
<g stroke="#35190d" stroke-width="2" stroke-linejoin="round">
<path d="M3 13C10 8 21 8 30 14 23 20 12 20 3 16Z" fill="#ef3024"/><path d="M4 12h8l12 5c-6 2-13 2-19 0Z" fill="#1764de"/><path d="M5 11c7-3 13-3 19 0l-4 3H4Z" fill="#20bc4b" stroke="none"/>
<path d="M61 13C54 8 43 8 34 14c7 6 18 6 27 2Z" fill="#ef3024"/><path d="M60 12h-8l-12 5c6 2 13 2 19 0Z" fill="#1764de"/><path d="M59 11c-7-3-13-3-19 0l4 3h16Z" fill="#20bc4b" stroke="none"/>
<path d="M29 12a3 3 0 0 1 6 0v13h-6Z" fill="url(#gold)"/><path d="M25 12a7 7 0 0 1 14 0v4H25Z" fill="url(#gold)"/>
<path d="M16 22c1-7 7-11 16-11s15 4 16 11" fill="#ffcf28"/><path d="M16 22c0-6 5-11 10-12v12Z" fill="#1764de" stroke="none"/><path d="M38 10c5 1 10 6 10 12H38Z" fill="#20bc4b" stroke="none"/>
<rect x="8" y="20" width="48" height="42" rx="12" fill="url(#body)" stroke-width="2.5"/>
<path d="M10 27c4-5 10-7 20-7s16 2 24 7" fill="none" stroke="#ffd976" stroke-width="2"/>
<circle cx="22" cy="35" r="6" fill="#fffaf0" stroke-width="1.6"/><circle cx="42" cy="35" r="6" fill="#fffaf0" stroke-width="1.6"/>
<circle cx="23" cy="36" r="3" fill="#21140e" stroke="none"/><circle cx="43" cy="36" r="3" fill="#21140e" stroke="none"/>
<circle cx="24" cy="35" r="1" fill="#fff" stroke="none"/><circle cx="44" cy="35" r="1" fill="#fff" stroke="none"/>
<path d="M25 43q7 8 14 0" fill="none" stroke="#21140e" stroke-width="2.5" stroke-linecap="round"/>
<rect x="17" y="49" width="30" height="10" rx="2" fill="#fffaf0" stroke-width="1.5"/>
<path d="M20 51h4v4h-4zm1 1v2h2v-2zm7-1h2v2h-2zm4 0h2v4h-2zm5 0h7v2h-2v2h-2v-2h-3zM20 56h3v2h-3zm5-1h2v3h-2zm5 1h3v2h-3zm5-1h2v3h-2zm5 1h4v2h-4z" fill="#21140e" stroke="none"/>
</g></svg></div><div class="wordmark">GYROCLOPTER</div></div><div class="status"><i class="dot" id="status-dot"></i><span id="status-text">DISCONNECTED</span></div></header>
<section class="settings"><div class="setting"><div class="row"><label for="scroll-sens">SCROLL SENSITIVITY</label><output class="value" id="scroll-val">5</output></div><input id="scroll-sens" type="range" min="1" max="10" value="5"></div><div class="setting"><div class="row"><label for="pointer-sens">POINTER SENSITIVITY</label><output class="value" id="pointer-val">10</output></div><input id="pointer-sens" type="range" min="1" max="25" value="10"><div class="guard"><span>JITTER GUARD</span><button data-guard="low" aria-pressed="false" aria-label="Low jitter guard">LOW</button><button data-guard="balanced" aria-pressed="true" aria-label="Balanced jitter guard">MID</button><button data-guard="high" aria-pressed="false" aria-label="High jitter guard">HIGH</button></div></div></section>
<section class="playfield" id="playfield" aria-label="Gesture area. Swipe vertically to scroll."><button class="key" id="right-click" aria-label="Right click"><span>R</span></button><button class="key" id="left-click" aria-label="Left click"><span>L</span></button></section>
<button class="connect" id="connect"><i class="dot" id="connect-dot"></i><span id="connect-label">CONNECT</span></button>

</main>
<div id="modal"><h2 id="modal-title">Connect Gyroclopter</h2><p id="modal-body">Allow motion access, then connect to move the pointer with your phone.</p><button class="primary" id="start-btn">ALLOW & CONNECT</button></div>
<script>
const state={ws:null,connected:false,connecting:false,calibrated:false,sensitivity:10,scrollSensitivity:5,guard:'balanced',reconnectTimer:null,reconnectDelay:1000,leftDown:false,permissionGranted:false};
const $=id=>document.getElementById(id);
function setStatus(label,connected=false){$('status-text').textContent=label;$('status-dot').style.background=connected?'#16b942':'#e89a20';$('connect-label').textContent=connected?'DISCONNECT':'CONNECT'}
function send(data){if(state.connected&&state.ws&&state.ws.readyState===WebSocket.OPEN){try{state.ws.send(JSON.stringify(data));return true}catch(e){setStatus('SEND ERROR');return false}}return false}
function releaseLeft(){if(state.leftDown){send({type:'up'});state.leftDown=false}}
function connectSocket(){if(state.connecting||state.connected)return;state.connecting=true;setStatus('CONNECTING');const proto=location.protocol==='https:'?'wss:':'ws:';let ws;try{ws=new WebSocket(proto+'//'+location.host)}catch(e){state.connecting=false;setStatus('CONNECTION ERROR');scheduleReconnect();return}state.ws=ws;ws.onopen=()=>{if(ws!==state.ws){ws.close();return}state.connecting=false;state.connected=true;state.calibrated=true;state.reconnectDelay=1000;clearTimeout(state.reconnectTimer);setStatus('CONNECTED',true);$('modal').classList.add('hidden')};ws.onerror=()=>{setStatus('CONNECTION ERROR')};ws.onclose=()=>{if(ws!==state.ws)return;state.connected=false;state.connecting=false;releaseLeft();setStatus('DISCONNECTED');if(state.userWantsConnection)scheduleReconnect()}}
function scheduleReconnect(){if(!state.userWantsConnection||state.reconnectTimer)return;state.reconnectTimer=setTimeout(()=>{state.reconnectTimer=null;state.reconnectDelay=Math.min((state.reconnectDelay||1000)*2,12000);connectSocket()},state.reconnectDelay||1000)}
function disconnect(){state.userWantsConnection=false;clearTimeout(state.reconnectTimer);state.reconnectTimer=null;releaseLeft();if(state.ws){const ws=state.ws;state.ws=null;state.connected=false;state.connecting=false;try{ws.close()}catch(e){}}setStatus('DISCONNECTED');$('modal').classList.remove('hidden');$('modal-title').textContent='Gyroclopter Paused';$('modal-body').textContent='Tap connect when you are ready to control the pointer.';$('start-btn').textContent='CONNECT'}
function connectRequest(){state.userWantsConnection=true;if(!state.permissionGranted&&typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(result=>{if(result!=='granted')throw new Error('Motion permission denied');state.permissionGranted=true;window.addEventListener('devicemotion',handleMotion);connectSocket()}).catch(()=>{$('modal-title').textContent='Motion Access Needed';$('modal-body').textContent='Allow motion access in your browser settings, then tap Connect again.'})}else{state.permissionGranted=true;window.addEventListener('devicemotion',handleMotion,{passive:true});connectSocket()}}
function handleMotion(e){if(!state.connected||!state.calibrated)return;const rr=e.rotationRate;if(!rr||rr.alpha==null||rr.gamma==null)return;let gx=-rr.gamma,gy=-rr.alpha;const dead={low:.15,balanced:.10,high:1.25}[state.guard];gx=Math.abs(gx)<dead?0:Math.sign(gx)*(Math.abs(gx)-dead);gy=Math.abs(gy)<dead?0:Math.sign(gy)*(Math.abs(gy)-dead);const dx=Math.round(gx*state.sensitivity*.05),dy=Math.round(gy*state.sensitivity*.05);if(dx||dy)send({type:'move',dx,dy})}
function setRange(id,out,cb){$(id).addEventListener('input',e=>{const v=Number(e.target.value);$(out).textContent=v;cb(v)})}
setRange('pointer-sens','pointer-val',v=>state.sensitivity=v);setRange('scroll-sens','scroll-val',v=>state.scrollSensitivity=v);
document.querySelectorAll('[data-guard]').forEach(b=>b.onclick=()=>{state.guard=b.dataset.guard;document.querySelectorAll('[data-guard]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('connect').onclick=()=>state.connected?disconnect():connectRequest();$('start-btn').onclick=connectRequest;
$('left-click').addEventListener('pointerdown',e=>{e.preventDefault();if(send({type:'down'})){state.leftDown=true;$('left-click').setPointerCapture(e.pointerId)}});
$('left-click').addEventListener('pointerup',e=>{e.preventDefault();releaseLeft()});['pointercancel','lostpointercapture'].forEach(t=>$('left-click').addEventListener(t,releaseLeft));
$('right-click').addEventListener('pointerdown',e=>{e.preventDefault();send({type:'right'})});
let lastY=null,scrollRemainder=0;const surface=$('playfield'),excluded=e=>e.target.closest('button');
surface.addEventListener('pointerdown',e=>{if(excluded(e))return;lastY=e.clientY;scrollRemainder=0;surface.setPointerCapture(e.pointerId)});
surface.addEventListener('pointermove',e=>{if(lastY===null)return;const diff=lastY-e.clientY;scrollRemainder+=diff*state.scrollSensitivity/5;const threshold=Math.max(3,11-state.scrollSensitivity);if(Math.abs(scrollRemainder)>=threshold){const steps=Math.trunc(scrollRemainder/threshold);send({type:'scroll',delta:Math.sign(steps)*120*Math.min(Math.abs(steps),4)});scrollRemainder-=steps*threshold;lastY=e.clientY}});
function endSwipe(){lastY=null;scrollRemainder=0}['pointerup','pointercancel','lostpointercapture'].forEach(t=>surface.addEventListener(t,endSwipe));
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseLeft()});window.addEventListener('pagehide',releaseLeft);
</script></body></html>
