<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gyroclopter Web Pilot</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#141b2e;--line:#26304a;--text:#f7f9ff;--muted:#9aa7c3;--accent:#7dd3fc;--good:#6ee7b7;--bad:#fda4af}
    *{box-sizing:border-box}body{margin:0;width:360px;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand img{width:34px;height:34px}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.status{font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px}.dot.good{background:var(--good)}input[type=text]{width:100%;border:1px solid var(--line);background:#0d1426;color:var(--text);border-radius:9px;padding:9px}button{border:1px solid var(--line);background:#1b2540;color:var(--text);padding:9px 11px;border-radius:9px;font-weight:650;cursor:pointer}button.primary{background:var(--accent);color:#07111c;border-color:transparent}button.danger{color:#fecdd3}button:disabled{opacity:.45;cursor:default}.stack{display:grid;gap:8px}.qr{display:none;margin:10px auto 2px;width:190px;height:190px;background:white;border-radius:10px;padding:6px}.fine{font-size:11px;color:var(--muted)}label.toggle{display:flex;align-items:center;gap:8px}.error{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}a{color:var(--accent)}
  </style>
</head>
<body>
  <div class="brand"><img src="icons/48.png" alt=""><div><strong>Web Pilot</strong><small id="build-label">Gyroclopter 0.6 skunk</small></div></div>

  <div class="card stack">
    <div class="status"><span id="relay-dot" class="dot"></span><span id="relay-status">Relay disconnected</span></div>
    <input id="relay-url" type="text" value="https://127.0.0.1:9443" spellcheck="false">
    <div class="row"><button id="trust" class="grow">Trust local relay</button><button id="pair" class="primary grow">Pair phone</button></div>
    <img id="qr" class="qr" alt="Pairing QR code">
    <div id="pair-hint" class="fine">Private testing: start the relay, trust its local certificate once, then pair.</div>
  </div>

  <div class="card stack">
    <div class="status"><span id="phone-dot" class="dot"></span><span id="phone-status">Phone not paired</span></div>
    <button id="arm" class="primary">Arm current tab</button>
    <button id="always">Allow this site whenever I open Web Pilot</button>
    <label id="full-row" class="toggle"><input id="full" type="checkbox"> Full browser input (private build)</label>
    <div class="fine">Esc, navigation, closing the tab, or switching tabs immediately disarms control.</div>
  </div>

  <div class="card row">
    <button id="reset" class="grow">Reset site learning</button>
    <button id="forget" class="danger">Forget pairing</button>
  </div>
  <div id="error" class="error"></div>
  <script src="popup.js"></script>
</body>
</html>
